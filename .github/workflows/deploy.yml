# Deploy the API to AWS.
#
# Authentication is OIDC: GitHub mints a short-lived token, AWS trusts it only
# from this repository on this branch, and no access key exists to leak. The
# role and the state bucket are created once by scripts/bootstrap_aws.py.
#
# Only paths that change what is deployed trigger this. A manuscript edit does
# not rebuild a container image.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - applebee/**
      - web/**
      - infra/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

env:
  # The project's name and home, in one place. bootstrap_aws.py takes the same
  # --name and derives the role, the state bucket and the registry from it.
  PROJECT: applebee
  AWS_REGION: us-east-1

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write      # to request the OIDC token
  contents: read

jobs:
  pulumi:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: applebee-deploy-${{ github.run_id }}

      # buildx, so the image layers can be cached in ECR between runs and a
      # deploy does not reinstall 382 MB of scientific Python every time.
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # --provenance=false --sbom=false keep the push to a single manifest;
      # required when this ran on Lambda, harmless now.
      # Two images from one repository: the API, and the acquisition worker,
      # which carries the geospatial stack the API has no use for.
      - name: Build and push the images
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-api
        run: |
          build () {          # $1 dockerfile, $2 tag, $3 cache suffix
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false --sbom=false \
              --cache-from "type=registry,ref=$REPO:cache-$3" \
              --cache-to "type=registry,ref=$REPO:cache-$3,mode=max,image-manifest=true,oci-mediatypes=true" \
              -f "$1" -t "$2" --push .
          }
          api="$REPO:${{ github.sha }}"
          worker="$REPO:worker-${{ github.sha }}"
          build deploy/Dockerfile.server "$api" api
          build deploy/Dockerfile.worker "$worker" worker
          echo "uri=$api" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"

      - name: Install Pulumi's dependencies
        working-directory: infra
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - uses: pulumi/actions@v6
        id: pulumi
        with:
          command: up
          stack-name: production
          work-dir: infra
          cloud-url: s3://${{ secrets.PULUMI_STATE_BUCKET }}
          upsert: true          # create the stack on the first run
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          APPLEBEE_ADMIN_TOKEN: ${{ secrets.APPLEBEE_ADMIN_TOKEN }}
          APPLEBEE_IMAGE_URI: ${{ steps.image.outputs.uri }}
          APPLEBEE_WORKER_IMAGE_URI: ${{ steps.image.outputs.worker }}

      - name: Where it is
        run: |
          echo "### AppleBee deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.pulumi.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
