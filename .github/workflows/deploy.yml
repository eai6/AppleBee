# Deploy the API to AWS.
#
# Authentication is OIDC: GitHub mints a short-lived token, AWS trusts it only
# from this repository on this branch, and no access key exists to leak. The
# role and the state bucket are created once by scripts/bootstrap_aws.py.
#
# Only paths that change what is deployed trigger this. A manuscript edit does
# not rebuild a container image.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - applebee/**
      - web/**
      - infra/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write      # to request the OIDC token
  contents: read

jobs:
  pulumi:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Temporary: "Not authorized to perform sts:AssumeRoleWithWebIdentity"
      # names neither the claim nor the value that failed to match, so print the
      # identifying claims. Only sub/aud/repository — never the token itself.
      - name: Show the OIDC claims this job gets
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "ref", "environment"):
              print(f"{key}: {claims.get(key)!r}")
          PY

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: applebee-deploy-${{ github.run_id }}

      # buildx, so the image layers can be cached in ECR between runs and a
      # deploy does not reinstall 382 MB of scientific Python every time.
      - uses: docker/setup-buildx-action@v3

      - name: Install Pulumi's dependencies
        working-directory: infra
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: production
          work-dir: infra
          cloud-url: s3://${{ secrets.PULUMI_STATE_BUCKET }}
          upsert: true          # create the stack on the first run
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          APPLEBEE_ADMIN_TOKEN: ${{ secrets.APPLEBEE_ADMIN_TOKEN }}
